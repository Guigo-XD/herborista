<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utilitário Herborista</title>
  <style>
    :root {
      --bg: #4a5f3a;
      --bg-dark: #2c3a24;
      --card: #f1e0bc;
      --card-dark: #6b5c3d;
      --accent: #8ba46a;
      --text: #222;
      --text-dark: #eee;
      --input: #e8d9b0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg), #3d4f2f);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      transition: all 0.4s ease;
    }

    .dark-mode {
      background: linear-gradient(135deg, var(--bg-dark), #1f2a1a);
      color: var(--text-dark);
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease;
    }

    .header h1 {
      font-size: 2.8rem;
      margin-bottom: 8px;
      text-shadow: 0 3px 10px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .box {
      background: var(--card);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeInUp 0.6s ease backwards;
    }

    .box:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .dark-mode .box { background: var(--card-dark); }

    .titulo {
      font-size: 1.85rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      color: #2c3a24;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .dark-mode .titulo { color: #f1e0bc; }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
      font-size: 1.05rem;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--input);
      font-size: 1.05rem;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(139, 164, 106, 0.4);
      transform: scale(1.02);
    }

    .dark-mode input, .dark-mode select {
      background: #4a3f2a;
      color: #f1e0bc;
    }

    .resultado {
      margin-top: 20px;
      padding: 20px;
      background: #2c3a24;
      color: #f1e0bc;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      animation: popIn 0.4s ease;
    }

    #resultados {
      margin-top: 20px;
      padding: 20px;
      background: rgba(44, 58, 36, 0.15);
      border-radius: 16px;
      max-height: 520px;
      overflow-y: auto;
      animation: fadeIn 0.5s ease;
    }

    .lucro {
      margin: 15px 0;
      padding: 15px;
      background: #2c3a24;
      color: #a3d977;
      border-radius: 12px;
      font-size: 1.15rem;
      text-align: center;
      font-weight: bold;
    }

    .dark-mode .lucro {
      background: #3d4f2a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
    }

    th {
      background: var(--accent);
      color: white;
      padding: 14px 12px;
      text-align: left;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    tr:hover { background: rgba(255,255,255,0.25); }

    .modo-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: rgba(0,0,0,0.75);
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modo-btn:hover {
      transform: scale(1.08) translateY(-3px);
      background: #000;
    }

    .icon { width: 32px; height: 32px; fill: currentColor; }

    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Utilitário Herborista
    </h1>
    <p>🌱 Ferramenta completa para crafters</p>
  </div>

  <div class="container">
    <div class="box" style="animation-delay: 0.1s">
      <div class="titulo">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
        Calculadora de Preço
      </div>
      <label for="valor">Valor unitário ($)</label>
      <input type="number" id="valor" step="0.01" placeholder="Ex: 0.50" oninput="calcularTotalPreco()">

      <label for="quantidadeBR">Quantidade</label>
      <input type="number" id="quantidadeBR" placeholder="Ex: 3" oninput="calcularTotalPreco()">

      <div class="resultado" id="resultado">Total aparecerá aqui...</div>
    </div>

    <div class="box" style="animation-delay: 0.3s">
      <div class="titulo">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8-4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></svg>
        Calculadora de Craft
      </div>
      
      <label for="categoria">Categoria</label>
      <select id="categoria" onchange="popularProdutos(); calcularHerborista()">
        <option value="">-- Selecione --</option>
      </select>

      <label for="produto">Produto</label>
      <select id="produto" onchange="calcularHerborista()">
        <option value="">-- Selecione --</option>
      </select>

      <label for="quantidadeH">Quantidade desejada</label>
      <input type="number" id="quantidadeH" min="1" value="1" oninput="calcularHerborista()">

      <div id="resultados"></div>
    </div>
  </div>

  <button class="modo-btn" onclick="alternarModo()">
    <span id="modo-icon">🌗</span> Modo Escuro
  </button>

  <div style="text-align:center; margin-top:50px; color:rgba(255,255,255,0.7); font-size:0.95rem;">
    Criado por Bresolindo - Atualizado por GuigoXD• 
    <a href="https://discord.gg/YPYUMruRt9" target="_blank" style="color:inherit;">Discord</a>
  </div>

<script>
  function alternarModo() {
    document.body.classList.toggle('dark-mode');
    const icon = document.getElementById('modo-icon');
    icon.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌗';
  }

  function calcularTotalPreco() {
    const valor = parseFloat(document.getElementById('valor').value);
    const quantidade = parseInt(document.getElementById('quantidadeBR').value);
    const resultado = document.getElementById('resultado');

    if (isNaN(valor) || isNaN(quantidade)) {
      resultado.textContent = "Total aparecerá aqui...";
      return;
    }
    const total = valor * quantidade;
    resultado.innerHTML = `Total a cobrar: <span style="color:#a3d977; font-size:1.3em;">$${total.toFixed(2)}</span>`;
  }

  // ===================== DADOS =====================
  const materiais = {
    "Garrafa Vazia": 0.04, "Álcool": 0.13, "Água Destilada": 0.04, "Garrafa de Água": 0.03, "Querosene": 0.12,
    "Sal": 0.03, "Torrão de Açúcar": 0.03, "Algodão": 0.02, "Carvão Mineral": 0.03, "Ovo de Jacaré": 0.05,
    "Veneno de Sapo": 0.17, "Veneno de Cobra": 0.12, "Chifre de Cariacu": 0.04, "Galhada de Uapiti": 0.04,
    "Garra de Raposa": 0.04, "Gordura Animal": 0.02, "Ginseng Alasca": 0.02, "Ginseng Americano": 0.02,
    "Salvia Oleandro": 0.02, "Salvia Beija flor": 0.02, "Cassis Dourado": 0.02, "Cassis": 0.02,
    "Papoula da Padaria": 0.02, "Tabaco Indiano": 0.02, "Maitake": 0.02, "Quinina Silvestre": 0.02,
    "Cenoura Selvagem": 0.02, "Glicínia": 0.04, "Menta": 0.02, "Amora": 0.02, "Framboesa": 0.02,
    "Flor de Baunilha": 0.02, "Fibra Vegetal": 0.01, "Margarida Chocolate": 0.04, "Gorro Azul Texano": 0.04,
    "Dama da Noite": 0.05, "Secador de Tecido": 0.09, "Alho das vinhas": 0.02, "Flor de Cannabis": 0.05
  };

  const receitas = {
    "Bebidas": {
      "Chá de Baunilha": { quantidadeProduzida: 1, materiais: { "Flor de Baunilha": 3, "Garrafa de Água": 1, "Torrão de Açúcar": 1 }, valorUnitario: 0.18 }
    },
    "Consumíveis": {
      "Estabilizante": { quantidadeProduzida: 3, materiais: { "Solução Medicinal": 1, "Veneno de Sapo": 1, "Preparo de Ervas": 1, "Maitake": 1 }, valorUnitario: 0.15 },
      "Antídoto": { quantidadeProduzida: 1, materiais: { "Solução Medicinal": 2, "Tabaco Indiano": 6, "Papoula da Padaria": 6, "Veneno de Cobra": 1 }, valorUnitario: 1.00 },
      "Ataduras": { quantidadeProduzida: 6, materiais: { "Álcool": 1, "Fibra Vegetal": 1, "Algodão": 6 }, valorUnitario: 0.06 },
      "Tônico": { quantidadeProduzida: 2, materiais: { "Solução Medicinal": 1, "Preparo de Ervas": 1, "Cassis": 2, "Garrafa Vazia": 2 }, valorUnitario: 0.45 },
      "Tônico potente": { quantidadeProduzida: 2, materiais: { "Solução Medicinal": 1, "Preparo de Ervas": 1, "Cassis Dourado": 6, "Ovo de Jacaré": 1, "Garrafa Vazia": 2 }, valorUnitario: 0.55 },
      "Suplemento para cavalos": { quantidadeProduzida: 4, materiais: { "Preparo de Ervas": 1, "Maitake": 1, "Quinina Silvestre": 1, "Cenoura Selvagem": 1 }, valorUnitario: 0.08 },
      "Sabonete": { quantidadeProduzida: 2, materiais: { "Gordura Animal": 3, "Framboesa": 1, "Menta": 1, "Amora": 1 }, valorUnitario: 0.10 },
      "Sabonete de Glicínia": { quantidadeProduzida: 2, materiais: { "Gordura Animal": 3, "Framboesa": 1, "Menta": 1, "Amora": 1, "Glicínia": 1 }, valorUnitario: 0.15 },
      "Xarope Natural": { quantidadeProduzida: 2, materiais: { "Solução Medicinal": 1, "Torrão de Açúcar": 2, "Preparo de Ervas": 1, "Alho das vinhas": 3, "Menta": 3, "Garrafa Vazia": 1 }, valorUnitario: 0.40 }
    },
    "Materiais": {
      "Solução para curtir": { quantidadeProduzida: 6, materiais: { "Garrafa de Água": 6, "Amoníaco": 1, "Sal": 3 }, valorUnitario: 0.20 },
      "Solução Medicinal": { quantidadeProduzida: 3, materiais: { "Água Destilada": 1, "Álcool": 1, "Garrafa Vazia": 3 }, valorUnitario: 0.10 },
      "Preparo de Ervas": { quantidadeProduzida: 2, materiais: { "Ginseng Alasca": 1, "Ginseng Americano": 1, "Salvia Oleandro": 1, "Salvia Beija flor": 1 }, valorUnitario: 0.04 },
      "Amoníaco": { quantidadeProduzida: 1, materiais: { "Álcool": 1, "Água Destilada": 1, "Chifre de Cariacu": 1, "Garra de Raposa": 1, "Gordura Animal": 3 }, valorUnitario: 0.31 },
      "Tinta": { quantidadeProduzida: 12, materiais: { "Querosene": 1, "Galhada de Uapiti": 2, "Carvão Mineral": 3 }, valorUnitario: 0.04 },
      "Goma de Maitake": { quantidadeProduzida: 5, materiais: { "Maitake": 3, "Torrão de Açúcar": 3, "Garrafa de Água": 3 }, valorUnitario: 0.10 },
      "Secador de Tecido": { quantidadeProduzida: 1, materiais: { "Fibra Vegetal": 3, "Algodão": 3 }, valorUnitario: 0.09 },
      "Resina seca de papoula": { quantidadeProduzida: 5, materiais: { "Papoula da Padaria": 3, "Garrafa Vazia": 5, "Secador de Tecido": 1 }, valorUnitario: 0.14 },
      "Buquê": { quantidadeProduzida: 1, materiais: { "Cassis Dourado": 1, "Salvia Beija flor": 1, "Margarida Chocolate": 1, "Gorro Azul Texano": 1, "Dama da Noite": 1, "Fibra Vegetal": 2 }, valorUnitario: 1.00 },
      "Goma de Cannabis": { quantidadeProduzida: 5, materiais: { "Flor de Cannabis": 3, "Torrão de Açúcar": 3, "Garrafa de Água": 3 }, valorUnitario: 0.12 }
    }
  };

  function calcularCustoItem(item) {
    if (materiais[item] !== undefined) return materiais[item];
    for (const categoria in receitas) {
      if (receitas[categoria][item]) {
        const receita = receitas[categoria][item];
        let custoTotal = 0;
        for (const mat in receita.materiais) {
          custoTotal += calcularCustoItem(mat) * receita.materiais[mat];
        }
        return custoTotal / receita.quantidadeProduzida;
      }
    }
    return 0;
  }

  const categoriaSelect = document.getElementById('categoria');
  const produtoSelect = document.getElementById('produto');

  for (const cat in receitas) {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    categoriaSelect.appendChild(opt);
  }

  function popularProdutos() {
    const cat = categoriaSelect.value;
    produtoSelect.innerHTML = '<option value="">-- Selecione --</option>';
    if (!receitas[cat]) return;
    for (const prod in receitas[cat]) {
      const opt = document.createElement('option');
      opt.value = prod;
      opt.textContent = prod;
      produtoSelect.appendChild(opt);
    }
  }

<!-- Substitua apenas a função calcularHerborista() pela nova abaixo -->

function calcularHerborista() {
  const categoria = categoriaSelect.value;
  const produto = produtoSelect.value;
  const quantidadeDesejada = parseInt(document.getElementById('quantidadeH').value);
  const resultadosDiv = document.getElementById('resultados');

  if (!categoria || !produto || !quantidadeDesejada || quantidadeDesejada <= 0) {
    resultadosDiv.innerHTML = "";
    return;
  }

  const receita = receitas[categoria][produto];
  const lotes = Math.ceil(quantidadeDesejada / receita.quantidadeProduzida);

  // === CÁLCULOS AJUSTADOS ===
  const quantidadeProduzidaTotal = lotes * receita.quantidadeProduzida;
  const custoTotalMateriais = calcularCustoTotalMateriais(receita, lotes);
  
  // Valor de venda agora considera a quantidade PRODUZIDA (lotes completos)
  const valorVendaTotal = receita.valorUnitario * quantidadeProduzidaTotal;

  const lucro = valorVendaTotal - custoTotalMateriais;
  const margem = valorVendaTotal > 0 ? (lucro / valorVendaTotal) * 100 : 0;

  let html = `<h2>${produto}</h2>`;
  html += `<p><strong>Valor unitário de venda:</strong> $${receita.valorUnitario.toFixed(2)}</p>`;
  html += `<p><strong>Quantidade desejada:</strong> ${quantidadeDesejada} un</p>`;
  html += `<p><strong>Lotes necessários:</strong> ${lotes}</p>`;
  html += `<p><strong>Quantidade produzida:</strong> ${quantidadeProduzidaTotal} un</p>`;

  // Tabela de materiais
  html += `<h3>Materiais necessários (${lotes} lote${lotes > 1 ? 's' : ''})</h3>`;
  html += `<table><thead><tr><th>Item</th><th>Quantidade</th><th>Custo Unit.</th><th>Custo Total</th></tr></thead><tbody>`;

  for (const mat in receita.materiais) {
    const qtd = receita.materiais[mat] * lotes;
    const custoUnit = calcularCustoItem(mat);
    const custoTot = custoUnit * qtd;
    html += `<tr>
      <td>${mat}</td>
      <td>${qtd}</td>
      <td>$${custoUnit.toFixed(2)}</td>
      <td>$${custoTot.toFixed(2)}</td>
    </tr>`;
  }
  html += `</tbody></table>`;

  // Resumo Financeiro
  html += `
    <div class="lucro" style="background:#1e2f1e; border:2px solid #4ade80; padding:18px; border-radius:12px; margin-top:20px; font-size:1.1rem;">
      <strong>RESUMO FINANCEIRO</strong><br><br>
      Receita Total (venda de ${quantidadeProduzidaTotal} un): <strong>$${valorVendaTotal.toFixed(2)}</strong><br>
      Custo Total dos Materiais: <strong>$${custoTotalMateriais.toFixed(2)}</strong><br><br>
      <span style="font-size:1.4em; color:#4ade80;">
        Lucro Líquido: <strong>$${lucro.toFixed(2)}</strong>
      </span><br>
      Margem de Lucro: <strong>${margem.toFixed(1)}%</strong>
    </div>`;

  resultadosDiv.innerHTML = html;
}

// Função auxiliar
function calcularCustoTotalMateriais(receita, lotes) {
  let total = 0;
  for (const mat in receita.materiais) {
    total += calcularCustoItem(mat) * receita.materiais[mat] * lotes;
  }
  return total;
}
</script>
</body>
</html>
