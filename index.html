<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utilitário Herborista</title>
  <style>
    :root {
      --bg: #2c3f24;
      --card: #f8f1e0;
      --accent: #9bc88b;
      --accent-dark: #6b9c5e;
      --text: #1f2a1a;
      --text-light: #f0f0e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #2c3f24, #1a2418);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 10px;
    }

    .dark-mode {
      background: linear-gradient(135deg, #1a2418, #0f1a10);
      color: var(--text-light);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.9rem;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .tab-btn {
      padding: 14px 32px;
      background: rgba(255,255,255,0.15);
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #1f2a1a;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .craft-container {
      display: grid;
      grid-template-columns: 1fr 1.7fr;
      gap: 25px;
    }

    .box {
      background: rgba(248, 241, 224, 0.96);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    }

    .dark-mode .box { background: rgba(45,55,40,0.95); }

    .titulo {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      margin: 18px 0 8px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 1.05rem;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(155,200,139,0.3);
    }

    .dark-mode input, .dark-mode select {
      background: #37452f;
      color: #f0f0e0;
      border-color: #8ab87a;
    }

    #resultados {
      background: rgba(30,47,30,0.95);
      border-radius: 16px;
      padding: 22px;
      color: #e8f5e0;
      min-height: 100%;
    }

    .descricao {
      margin-top: 20px;
      padding: 18px;
      background: #2c3a24;
      border-radius: 12px;
      position: relative;
    }

    .btn-copiar {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 8px 14px;
      background: #4ade80;
      color: #1f2a1a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      overflow: hidden;
    }

    th { background: var(--accent-dark); color: white; padding: 16px 12px; }
    td { padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }

    .item-icon { font-size: 1.5rem; margin-right: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌿 Utilitário Herborista</h1>
  </div>

  <div class="tabs">
    <button class="tab-btn" onclick="openTab(0)">💰 Preço Rápido</button>
    <button class="tab-btn active" onclick="openTab(1)">⚗️ Calculadora de Craft</button>
  </div>

  <!-- Aba Preço -->
  <div id="tab0" class="tab-content">
    <div class="box">
      <div class="titulo">Calculadora de Preço</div>
      <label for="valor">Valor unitário ($)</label>
      <input type="number" id="valor" step="0.01" placeholder="Ex: 0.50" oninput="calcularTotalPreco()">
      <label for="quantidadeBR">Quantidade</label>
      <input type="number" id="quantidadeBR" placeholder="Ex: 3" oninput="calcularTotalPreco()">
      <div id="resultado" style="margin-top:25px;padding:20px;background:#2c3a24;border-radius:14px;text-align:center;font-size:1.3rem;"></div>
    </div>
  </div>

  <!-- Aba Craft (Principal) -->
  <div id="tab1" class="tab-content active">
    <div class="craft-container">
      <!-- Esquerda - Seleções -->
      <div class="box">
        <div class="titulo">Seleção</div>
        
        <label for="categoria">Categoria</label>
        <select id="categoria" onchange="popularProdutos(); calcularHerborista()">
          <option value="">-- Selecione --</option>
        </select>

        <label for="produto">Produto</label>
        <select id="produto" onchange="calcularHerborista()">
          <option value="">-- Selecione --</option>
        </select>

        <label for="quantidadeH">Quantidade desejada</label>
        <input type="number" id="quantidadeH" min="1" value="1" oninput="calcularHerborista()">
      </div>

      <!-- Direita - Resultados -->
      <div class="box">
        <div id="resultados"></div>
      </div>
    </div>
  </div>

  <button class="modo-btn" onclick="alternarModo()" style="position:fixed;bottom:25px;right:25px;padding:14px 24px;border-radius:50px;background:rgba(0,0,0,0.85);color:white;border:none;cursor:pointer;">
    <span id="modo-icon">🌗</span> Modo Escuro
  </button>

<script>
  function openTab(n) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab' + n).classList.add('active');
    document.querySelectorAll('.tab-btn')[n].classList.add('active');
  }

  function alternarModo() {
    document.body.classList.toggle('dark-mode');
    document.getElementById('modo-icon').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌗';
  }

  function calcularTotalPreco() {
    const valor = parseFloat(document.getElementById('valor').value);
    const qtd = parseInt(document.getElementById('quantidadeBR').value);
    const res = document.getElementById('resultado');
    if (isNaN(valor) || isNaN(qtd)) {
      res.textContent = "Total aparecerá aqui...";
      return;
    }
    res.innerHTML = `Total a cobrar: <strong style="color:#a3d977;">$${(valor * qtd).toFixed(2)}</strong>`;
  }

 // Ícones
  const icones = {
    "Garrafa Vazia": "🫙", "Álcool": "🧴", "Água Destilada": "💧", "Garrafa de Água": "🥛",
    "Querosene": "🛢️", "Sal": "🧂", "Torrão de Açúcar": "🍬", "Algodão": "☁️", "Cassis":"🫐",
    "Maitake": "🍄", "Flor de Baunilha": "🌸", "Cassis Dourado": "🫐", "Papoula da Padaria": "🌺",
    "Ginseng Alasca": "🌱", "Ginseng Americano": "🌿", "Veneno de Sapo": "🐸", "Veneno de Cobra": "🐍",
    "Buquê": "💐", "Tônico": "🧪", "Tônico potente": "⚗️", "Estabilizante": "🧪", "Ovo de Jacaré": "🥚",
    "Antídoto": "💊",  "Cenoura Selvagem": "🥕", "Ataduras": "🩹", "Sabonete": "🧼", "Resina seca de papoula": "🌺", 
    "Goma de Maitake": "🍄", "Goma de Cannabis": "🌿", "Alho das vinhas":"🧄", "Menta":"🍃", "Preparo de Ervas": "🥗",
    "Solução Medicinal": "💉","default": "📦"
  };

  // Descrições
  const descricoes = {
    "Chá de Baunilha": "Um chá aromático de baunilha, ideal para relaxar e acompanhar uma boa conversa.",
    "Ataduras": "Conjunto de ataduras para primeiros socorros e atendimentos em campo. Uso recomendado apenas para médicos!",
    "Estabilizante": "Composto essencial para estabilizar pacientes em situações de emergência. Uso recomendado apenas para médicos!",
    "Tônico": "Mistura medicinal suave que ajuda a recuperar as forças e restaurar a saúde gradualmente.",
    "Tônico potente": "Versão concentrada do tônico, preparada com ingredientes raros e indicada para os casos mais graves.",
    "Antídoto": "Antídoto de ação rápida contra venenos, especialmente eficaz em picadas de cobra.",
    "Suplemento para cavalos": "Suplemento nutritivo usado no treinamento e condicionamento de cavalos. A dosagem deve ser ajustada por um treinador experiente.",
    "Sabonete": "Sabonete comum que proporciona limpeza e ajuda a manter a higiene diária.",
    "Sabonete de Glicínia": "Sabonete perfumado com essência de glicínia, oferecendo limpeza e um aroma floral duradouro.",
    "Xarope Natural": "Xarope medicinal preparado com ingredientes naturais para aliviar desconfortos e auxiliar na recuperação.",
    "Solução para curtir": "Mistura tradicional utilizada no curtimento do couro, garantindo resistência e um bom acabamento às peças.",
    "Goma de Maitake": "Uma goma medicinal extraída do cogumelo maitake, conhecida por suas propriedades revigorantes, ajudando a restaurar a energia e o vigor do corpo.",
    "Buquê": "Arranjo de flores frescas, perfeito para presentear alguém especial.",
    "Resina seca de papoula": "Resina extraída da papoula e cuidadosamente seca, utilizada no preparo de remédios e outras misturas.",
    "Tinta": "Tinta de alta qualidade, ideal para escrita e registros duradouros.",
    "Goma de Cannabis": "Uma goma de origem vegetal conhecida por suas propriedades relaxantes, ideal para aliviar a tensão e proporcionar uma sensação de tranquilidade."
  };

  const materiais = {
    "Garrafa Vazia": 0.04, "Álcool": 0.13, "Água Destilada": 0.04, "Garrafa de Água": 0.03, "Querosene": 0.12,
    "Sal": 0.03, "Torrão de Açúcar": 0.03, "Algodão": 0.02, "Carvão Mineral": 0.03, "Ovo de Jacaré": 0.05,
    "Veneno de Sapo": 0.17, "Veneno de Cobra": 0.12, "Chifre de Cariacu": 0.04, "Galhada de Uapiti": 0.04,
    "Garra de Raposa": 0.04, "Gordura Animal": 0.02, "Ginseng Alasca": 0.02, "Ginseng Americano": 0.02,
    "Salvia Oleandro": 0.02, "Salvia Beija flor": 0.02, "Cassis Dourado": 0.02, "Cassis": 0.02,
    "Papoula da Padaria": 0.02, "Tabaco Indiano": 0.02, "Maitake": 0.02, "Quinina Silvestre": 0.02,
    "Cenoura Selvagem": 0.02, "Glicínia": 0.04, "Menta": 0.02, "Amora": 0.02, "Framboesa": 0.02,
    "Flor de Baunilha": 0.02, "Fibra Vegetal": 0.01, "Margarida Chocolate": 0.04, "Gorro Azul Texano": 0.04,
    "Dama da Noite": 0.05, "Secador de Tecido": 0.09, "Alho das vinhas": 0.02, "Flor de Cannabis": 0.05
  };

  const receitas = {
    "Bebidas": {
      "Chá de Baunilha": { quantidadeProduzida: 1, materiais: { "Flor de Baunilha": 3, "Garrafa de Água": 1, "Torrão de Açúcar": 1 }, valorUnitario: 0.18 }
    },
    "Consumíveis": {
      "Estabilizante": { quantidadeProduzida: 3, materiais: { "Solução Medicinal": 1, "Veneno de Sapo": 1, "Preparo de Ervas": 1, "Maitake": 1 }, valorUnitario: 0.15 },
      "Antídoto": { quantidadeProduzida: 1, materiais: { "Solução Medicinal": 2, "Tabaco Indiano": 6, "Papoula da Padaria": 6, "Veneno de Cobra": 1 }, valorUnitario: 1.00 },
      "Ataduras": { quantidadeProduzida: 6, materiais: { "Álcool": 1, "Fibra Vegetal": 1, "Algodão": 6 }, valorUnitario: 0.06 },
      "Tônico": { quantidadeProduzida: 2, materiais: { "Solução Medicinal": 1, "Preparo de Ervas": 1, "Cassis": 2, "Garrafa Vazia": 2 }, valorUnitario: 0.45 },
      "Tônico potente": { quantidadeProduzida: 2, materiais: { "Solução Medicinal": 1, "Preparo de Ervas": 1, "Cassis Dourado": 6, "Ovo de Jacaré": 1, "Garrafa Vazia": 2 }, valorUnitario: 0.55 },
      "Suplemento para cavalos": { quantidadeProduzida: 4, materiais: { "Preparo de Ervas": 1, "Maitake": 1, "Quinina Silvestre": 1, "Cenoura Selvagem": 1 }, valorUnitario: 0.08 },
      "Sabonete": { quantidadeProduzida: 2, materiais: { "Gordura Animal": 3, "Framboesa": 1, "Menta": 1, "Amora": 1 }, valorUnitario: 0.10 },
      "Sabonete de Glicínia": { quantidadeProduzida: 2, materiais: { "Gordura Animal": 3, "Framboesa": 1, "Menta": 1, "Amora": 1, "Glicínia": 1 }, valorUnitario: 0.15 },
      "Xarope Natural": { quantidadeProduzida: 2, materiais: { "Solução Medicinal": 1, "Torrão de Açúcar": 2, "Preparo de Ervas": 1, "Alho das vinhas": 3, "Menta": 3, "Garrafa Vazia": 1 }, valorUnitario: 0.40 }
    },
    "Materiais": {
      "Solução para curtir": { quantidadeProduzida: 6, materiais: { "Garrafa de Água": 6, "Amoníaco": 1, "Sal": 3 }, valorUnitario: 0.20 },
      "Solução Medicinal": { quantidadeProduzida: 3, materiais: { "Água Destilada": 1, "Álcool": 1, "Garrafa Vazia": 3 }, valorUnitario: 0.10 },
      "Preparo de Ervas": { quantidadeProduzida: 2, materiais: { "Ginseng Alasca": 1, "Ginseng Americano": 1, "Salvia Oleandro": 1, "Salvia Beija flor": 1 }, valorUnitario: 0.04 },
      "Amoníaco": { quantidadeProduzida: 1, materiais: { "Álcool": 1, "Água Destilada": 1, "Chifre de Cariacu": 1, "Garra de Raposa": 1, "Gordura Animal": 3 }, valorUnitario: 0.31 },
      "Tinta": { quantidadeProduzida: 12, materiais: { "Querosene": 1, "Galhada de Uapiti": 2, "Carvão Mineral": 3 }, valorUnitario: 0.04 },
      "Goma de Maitake": { quantidadeProduzida: 5, materiais: { "Maitake": 3, "Torrão de Açúcar": 3, "Garrafa de Água": 3 }, valorUnitario: 0.10 },
      "Secador de Tecido": { quantidadeProduzida: 1, materiais: { "Fibra Vegetal": 3, "Algodão": 3 }, valorUnitario: 0.09 },
      "Resina seca de papoula": { quantidadeProduzida: 5, materiais: { "Papoula da Padaria": 3, "Garrafa Vazia": 5, "Secador de Tecido": 1 }, valorUnitario: 0.14 },
      "Buquê": { quantidadeProduzida: 1, materiais: { "Cassis Dourado": 1, "Salvia Beija flor": 1, "Margarida Chocolate": 1, "Gorro Azul Texano": 1, "Dama da Noite": 1, "Fibra Vegetal": 2 }, valorUnitario: 1.00 },
      "Goma de Cannabis": { quantidadeProduzida: 5, materiais: { "Flor de Cannabis": 3, "Torrão de Açúcar": 3, "Garrafa de Água": 3 }, valorUnitario: 0.12 }
    }
  };

  function calcularCustoItem(item) {
    if (materiais[item] !== undefined) return materiais[item];
    for (const cat in receitas) {
      if (receitas[cat][item]) {
        let custo = 0;
        const rec = receitas[cat][item];
        for (const mat in rec.materiais) {
          custo += calcularCustoItem(mat) * rec.materiais[mat];
        }
        return custo / rec.quantidadeProduzida;
      }
    }
    return 0;
  }

  const categoriaSelect = document.getElementById('categoria');
  const produtoSelect = document.getElementById('produto');

  for (const cat in receitas) {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    categoriaSelect.appendChild(opt);
  }

  function popularProdutos() {
    const cat = categoriaSelect.value;
    produtoSelect.innerHTML = '<option value="">-- Selecione --</option>';
    if (receitas[cat]) {
      for (const prod in receitas[cat]) {
        const opt = document.createElement('option');
        opt.value = prod;
        opt.textContent = prod;
        produtoSelect.appendChild(opt);
      }
    }
  }

  function copiarDescricao(texto) {
    navigator.clipboard.writeText(texto).then(() => {
      alert("✅ Descrição copiada para a área de transferência!");
    });
  }

  function calcularHerborista() {
    const categoria = categoriaSelect.value;
    const produto = produtoSelect.value;
    const qtdDesejada = parseInt(document.getElementById('quantidadeH').value);
    const resultadosDiv = document.getElementById('resultados');

    if (!categoria || !produto || !qtdDesejada) {
      resultadosDiv.innerHTML = "";
      return;
    }

    const receita = receitas[categoria][produto];
    const lotes = Math.ceil(qtdDesejada / receita.quantidadeProduzida);
    const qtdProduzida = lotes * receita.quantidadeProduzida;

    let custoTotal = 0;
    let tabelaHTML = "";

    for (const mat in receita.materiais) {
      const qtd = receita.materiais[mat] * lotes;
      const custoU = calcularCustoItem(mat);
      const custoT = custoU * qtd;
      custoTotal += custoT;

      const emoji = icones[mat] || icones.default;
      tabelaHTML += `<tr>
        <td><span class="item-icon">${emoji}</span>${mat}</td>
        <td>${qtd}</td>
        <td>$${custoU.toFixed(2)}</td>
        <td>$${custoT.toFixed(2)}</td>
      </tr>`;
    }

    const valorVendaTotal = receita.valorUnitario * qtdProduzida;
    const lucro = valorVendaTotal - custoTotal;
    const margem = valorVendaTotal > 0 ? (lucro / valorVendaTotal) * 100 : 0;

    const descricao = descricoes[produto] || "Descrição não disponível.";

    let html = `<h2>${produto}</h2>`;
    html += `<p><strong>Valor unitário:</strong> $${receita.valorUnitario.toFixed(2)}</p>`;
    html += `<p><strong>Lotes necessários:</strong> ${lotes} → Produz ${qtdProduzida} un</p>`;

    html += `<h3>Materiais necessários</h3>`;
    html += `<table><thead><tr><th>Item</th><th>Qtde</th><th>Custo Unit.</th><th>Total</th></tr></thead><tbody>`;
    html += tabelaHTML;
    html += `</tbody></table>`;

    html += `
      <div class="lucro">
        Receita Total: <strong>$${valorVendaTotal.toFixed(2)}</strong><br>
        Custo Total: <strong>$${custoTotal.toFixed(2)}</strong><br><br>
        <strong style="font-size:1.35em;color:#4ade80;">Lucro: $${lucro.toFixed(2)}</strong><br>
        Margem: <strong>${margem.toFixed(1)}%</strong>
      </div>`;

    html += `
      <div class="descricao">
        <strong>Descrição:</strong><br>${descricao}
        <button class="btn-copiar" onclick="copiarDescricao('${descricao.replace(/'/g, "\\'")}')">Copiar</button>
      </div>`;

    resultadosDiv.innerHTML = html;
  }
</script>
</body>
</html>
